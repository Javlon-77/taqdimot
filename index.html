<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Planet Earth | Interactive Globe Showcase</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ikonkalari -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js va OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020208;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-container {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        .glass-card {
            background: rgba(10, 15, 30, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }
        .glow-title {
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.8), 0 0 40px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Interfeysi -->
    <div class="ui-container w-full h-full flex flex-col justify-between p-6 md:p-8">

        <!-- Tepasi (Header) -->
        <header class="flex justify-between items-center w-full">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 via-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-2xl shadow-lg shadow-cyan-500/40">
                    <i class="fa-solid fa-globe text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-black tracking-wider text-white glow-title">EARTH 3D EXPLORER</h1>
                    <p class="text-xs text-cyan-400 font-mono tracking-widest uppercase">Interaktiv Sayyora Taqdimoti</p>
                </div>
            </div>

            <!-- Holat Paneli -->
            <div class="hidden md:flex items-center space-x-6 glass-card px-6 py-3 rounded-2xl text-xs font-mono text-gray-300">
                <div>Aylanish: <span id="autoRotateStatus" class="text-emerald-400 font-bold">FAOL</span></div>
                <div class="h-4 w-px bg-gray-700"></div>
                <div>Masshtab: <span id="zoomLevel" class="text-cyan-400 font-bold">100%</span></div>
            </div>
        </header>

        <!-- Qit'alar va Joylarga Tezkor Uchish (Fly-To Control) -->
        <footer class="w-full flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Qi'talar Tugmalari -->
            <div class="flex flex-wrap gap-2 glass-card p-2 rounded-2xl interactive">
                <button onclick="flyToContinent('asia')" class="px-4 py-2 rounded-xl text-xs font-mono font-bold uppercase transition-all duration-300 bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/40">
                    <i class="fa-solid fa-location-dot mr-1"></i> Osiyo (Toshkent)
                </button>
                <button onclick="flyToContinent('europe')" class="px-4 py-2 rounded-xl text-xs font-mono font-bold uppercase transition-all duration-300 hover:bg-blue-500/30 text-gray-300 hover:text-blue-300">
                    <i class="fa-solid fa-location-dot mr-1"></i> Yevropa
                </button>
                <button onclick="flyToContinent('america')" class="px-4 py-2 rounded-xl text-xs font-mono font-bold uppercase transition-all duration-300 hover:bg-purple-500/30 text-gray-300 hover:text-purple-300">
                    <i class="fa-solid fa-location-dot mr-1"></i> Shimoliy Amerika
                </button>
                <button onclick="resetView()" class="px-4 py-2 rounded-xl text-xs font-mono font-bold uppercase transition-all duration-300 hover:bg-emerald-500/30 text-gray-300 hover:text-emerald-300">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Umumiy Ko'rinish
                </button>
            </div>

            <!-- Interaktiv Boshqaruv Tugmalari -->
            <div class="flex items-center space-x-3 interactive">
                <button onclick="toggleAutoRotate()" class="glass-card p-3 rounded-xl text-cyan-400 hover:text-white hover:bg-cyan-500/20 transition-all border border-cyan-500/40">
                    <i class="fa-solid fa-arrows-spin text-lg" id="rotateIcon"></i>
                </button>
                <button onclick="zoomIn()" class="glass-card p-3 rounded-xl text-cyan-400 hover:text-white hover:bg-cyan-500/20 transition-all border border-cyan-500/40">
                    <i class="fa-solid fa-magnifying-glass-plus text-lg"></i>
                </button>
                <button onclick="zoomOut()" class="glass-card p-3 rounded-xl text-cyan-400 hover:text-white hover:bg-cyan-500/20 transition-all border border-cyan-500/40">
                    <i class="fa-solid fa-magnifying-glass-minus text-lg"></i>
                </button>
            </div>
        </footer>
    </div>

    <!-- Three.js Engine Script -->
    <script>
        let scene, camera, renderer, controls;
        let earthMesh, cloudsMesh, atmosphereMesh, starsParticles;
        let isAutoRotating = true;

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene setup
            scene = new THREE.Scene();

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 25);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // 4. Orbit Controls (Aylantirish va Yaqinlashtirish)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.7;
            controls.zoomSpeed = 1.2;
            controls.minDistance = 12; // Maksimal yaqinlashish
            controls.maxDistance = 50; // Maksimal uzoqlashish
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;

            // 5. Yorug'lik (Lighting)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(5, 3, 5);
            scene.add(sunLight);

            // 6. YER SHARI (Texture Procedural Generator - Canvas orqali xaritani hosil qilish)
            const earthCanvas = createEarthTexture();
            const earthTexture = new THREE.CanvasTexture(earthCanvas);

            const earthGeometry = new THREE.SphereGeometry(6, 64, 64);
            const earthMaterial = new THREE.MeshPhongMaterial({
                map: earthTexture,
                shininess: 15
            });
            earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
            scene.add(earthMesh);

            // 7. BULUTLAR QATI (Clouds Layer)
            const cloudsCanvas = createCloudsTexture();
            const cloudsTexture = new THREE.CanvasTexture(cloudsCanvas);

            const cloudsGeometry = new THREE.SphereGeometry(6.1, 64, 64);
            const cloudsMaterial = new THREE.MeshStandardMaterial({
                map: cloudsTexture,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending
            });
            cloudsMesh = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
            scene.add(cloudsMesh);

            // 8. ATMOSFERA YOG'DUSI (Atmosphere Glow)
            const atmosphereGeometry = new THREE.SphereGeometry(6.3, 64, 64);
            const atmosphereMaterial = new THREE.MeshBasicMaterial({
                color: 0x00f0ff,
                transparent: true,
                opacity: 0.12,
                side: THREE.BackSide
            });
            atmosphereMesh = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            scene.add(atmosphereMesh);

            // 9. YULDUZLI FON (Starfield Background)
            createStarfield();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
        }

        // Dunyo xaritasini procedural yaratish (Fayl yuklash talab qilinmaydi)
        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Okean foni
            ctx.fillStyle = '#0a1d37';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Qit'alarni chizish (Procedural stil)
            ctx.fillStyle = '#1e3a29';
            for (let i = 0; i < 1500; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = Math.random() * 90 + 20;
                
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Muzliklar (Arktika va Antarktida)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, 80);
            ctx.fillRect(0, canvas.height - 90, canvas.width, 90);

            return canvas;
        }

        // Bulutlar teksturasini yaratish
        function createCloudsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 800; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = Math.random() * 50 + 10;

                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            return canvas;
        }

        // Yulduzlar tizimi
        function createStarfield() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 3000;
            const starPositions = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i++) {
                starPositions[i] = (Math.random() - 0.5) * 300;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
            starsParticles = new THREE.Points(starGeometry, starMaterial);
            scene.add(starsParticles);
        }

        // Xatolar va oyna o'lchami o'zgarganda
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animatsiya sikli
        function animate() {
            requestAnimationFrame(animate);

            // Bulutlar Yerga nisbatan sal sekinroq aylanadi
            cloudsMesh.rotation.y += 0.0004;
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Interaktiv Funksiyalar
        function toggleAutoRotate() {
            isAutoRotating = !isAutoRotating;
            controls.autoRotate = isAutoRotating;
            document.getElementById('autoRotateStatus').innerText = isAutoRotating ? "FAOL" : "TO'XTATILGAN";
            document.getElementById('autoRotateStatus').className = isAutoRotating ? "text-emerald-400 font-bold" : "text-amber-400 font-bold";
        }

        function zoomIn() {
            camera.position.multiplyScalar(0.8);
        }

        function zoomOut() {
            camera.position.multiplyScalar(1.2);
        }

        function flyToContinent(region) {
            controls.autoRotate = false;
            document.getElementById('autoRotateStatus').innerText = "TO'XTATILGAN";

            let targetX = 0, targetY = 0, targetZ = 18;

            if (region === 'asia') {
                targetX = 10; targetY = 6; targetZ = 14;
            } else if (region === 'europe') {
                targetX = 2; targetY = 10; targetZ = 14;
            } else if (region === 'america') {
                targetX = -12; targetY = 6; targetZ = 12;
            }

            // Kamera tekis uchib borishi
            let duration = 1000;
            let start = performance.now();
            let startPos = { x: camera.position.x, y: camera.position.y, z: camera.position.z };

            function step(timestamp) {
                let progress = Math.min((timestamp - start) / duration, 1);
                camera.position.x = startPos.x + (targetX - startPos.x) * progress;
                camera.position.y = startPos.y + (targetY - startPos.y) * progress;
                camera.position.z = startPos.z + (targetZ - startPos.z) * progress;
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function resetView() {
            flyToContinent('reset');
            controls.autoRotate = true;
            document.getElementById('autoRotateStatus').innerText = "FAOL";
        }

        init();
        animate();
    </script>
</body>
</html>
