<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-CORE 3D Interactive Audio-Visual Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030014;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .glow-text {
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.8), 0 0 30px rgba(147, 51, 234, 0.6);
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- 3D Canvas -->
    <div id="webgl-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer w-full h-full flex flex-col justify-between p-6 md:p-10">

        <!-- Top Header -->
        <header class="flex justify-between items-center w-full">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-purple-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-cubes text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-white glow-text">AURA 3D STUDIO</h1>
                    <p class="text-xs text-cyan-400 font-mono tracking-widest uppercase">Next-Gen Audio-Visual System</p>
                </div>
            </div>

            <!-- Audio Input Control -->
            <button id="micBtn" onclick="toggleAudioInput()" class="interactive px-5 py-3 glass-panel rounded-2xl border border-cyan-500/40 hover:border-cyan-400 text-cyan-300 hover:text-white transition-all duration-300 flex items-center gap-3 font-semibold text-sm">
                <i class="fa-solid fa-microphone" id="micIcon"></i>
                <span id="micText">Ovoz Vizualizatsiyasini Yoqish</span>
            </button>
        </header>

        <!-- Center Interactive Hint -->
        <div class="text-center my-auto pointer-events-none opacity-80 transition-opacity duration-500" id="centerHint">
            <h2 class="text-3xl md:text-5xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-indigo-400 glow-text mb-2">
                EKRANNI CHIZIB KO'RING
            </h2>
            <p class="text-sm font-mono text-gray-300">Sichqonchani harakatlantiring yoki tugmalarni bosing</p>
        </div>

        <!-- Bottom Controls Bar -->
        <footer class="w-full flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Mode Switcher -->
            <div class="flex gap-2 glass-panel p-2 rounded-2xl interactive border border-white/10">
                <button onclick="setMode('matrix')" class="px-5 py-2.5 rounded-xl text-xs font-mono font-bold uppercase transition-all duration-300 bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/40">
                    <i class="fa-solid fa-network-wired mr-1"></i> Matrix
                </button>
                <button onclick="setMode('core')" class="px-5 py-2.5 rounded-xl text-xs font-mono font-bold uppercase transition-all duration-300 hover:bg-purple-500/30 text-gray-300 hover:text-purple-300">
                    <i class="fa-solid fa-atom mr-1"></i> Core
                </button>
                <button onclick="setMode('vortex')" class="px-5 py-2.5 rounded-xl text-xs font-mono font-bold uppercase transition-all duration-300 hover:bg-pink-500/30 text-gray-300 hover:text-pink-300">
                    <i class="fa-solid fa-circle-notch mr-1"></i> Vortex
                </button>
            </div>

            <!-- Live Status Indicator -->
            <div class="glass-panel px-6 py-3 rounded-2xl flex items-center gap-6 font-mono text-xs text-gray-300">
                <div>FPS: <span id="fpsCount" class="text-emerald-400 font-bold">60</span></div>
                <div class="h-4 w-px bg-gray-700"></div>
                <div>Particles: <span class="text-cyan-400 font-bold">12,000</span></div>
                <div class="h-4 w-px bg-gray-700"></div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Realtime Engine
                </div>
            </div>
        </footer>
    </div>

    <!-- Three.js Engine Script -->
    <script>
        let scene, camera, renderer, particleSystem, geometry, material;
        let particleCount = 12000;
        let positions, colors;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let currentMode = 'matrix';
        
        // Audio Variables
        let audioContext, analyser, dataArray, micStream;
        let isAudioActive = false;

        function init() {
            const container = document.getElementById('webgl-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030014, 0.0015);

            // Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 3000);
            camera.position.z = 1000;

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Particles Geometry & Material
            geometry = new THREE.BufferGeometry();
            positions = new Float32Array(particleCount * 3);
            colors = new Float32Array(particleCount * 3);

            createMatrixShape();

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Custom glowing particle texture
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(8,8,0, 8,8,8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,16,16);

            const pTexture = new THREE.CanvasTexture(canvas);

            material = new THREE.PointsMaterial({
                size: 6,
                vertexColors: true,
                map: pTexture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            // Event Listeners
            document.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);
        }

        function createMatrixShape() {
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                positions[i3] = (Math.random() - 0.5) * 2000;
                positions[i3 + 1] = (Math.random() - 0.5) * 2000;
                positions[i3 + 2] = (Math.random() - 0.5) * 2000;

                colors[i3] = 0.0;
                colors[i3 + 1] = 0.8 + Math.random() * 0.2;
                colors[i3 + 2] = 1.0;
            }
        }

        function setMode(mode) {
            currentMode = mode;
            const pos = geometry.attributes.position.array;
            const col = geometry.attributes.color.array;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                if (mode === 'matrix') {
                    pos[i3] = (Math.random() - 0.5) * 2000;
                    pos[i3 + 1] = (Math.random() - 0.5) * 2000;
                    pos[i3 + 2] = (Math.random() - 0.5) * 2000;

                    col[i3] = 0.0;
                    col[i3 + 1] = 0.8;
                    col[i3 + 2] = 1.0;
                } else if (mode === 'core') {
                    const radius = 350 + Math.random() * 100;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);

                    pos[i3] = radius * Math.sin(phi) * Math.cos(theta);
                    pos[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    pos[i3 + 2] = radius * Math.cos(phi);

                    col[i3] = 0.7;
                    col[i3 + 1] = 0.1;
                    col[i3 + 2] = 1.0;
                } else if (mode === 'vortex') {
                    const u = Math.random();
                    const angle = i * 0.05;
                    const dist = u * 900;

                    pos[i3] = Math.cos(angle) * dist;
                    pos[i3 + 1] = (Math.random() - 0.5) * 300;
                    pos[i3 + 2] = Math.sin(angle) * dist;

                    col[i3] = 1.0;
                    col[i3 + 1] = 0.0;
                    col[i3 + 2] = 0.5;
                }
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
        }

        function onMouseMove(e) {
            mouseX = (e.clientX - window.innerWidth / 2);
            mouseY = (e.clientY - window.innerHeight / 2);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Microphone Audio Analyzer
        async function toggleAudioInput() {
            const btnText = document.getElementById('micText');
            const btnIcon = document.getElementById('micIcon');

            if (!isAudioActive) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 128;
                    const source = audioContext.createMediaStreamSource(micStream);
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    
                    isAudioActive = true;
                    btnText.innerText = "Audio Rejim Faol";
                    btnIcon.className = "fa-solid fa-volume-high text-emerald-400 animate-bounce";
                } catch (err) {
                    alert("Mikrofondan foydalanishga ruxsat berilmadi.");
                }
            } else {
                if(micStream) micStream.getTracks().forEach(track => track.stop());
                isAudioActive = false;
                btnText.innerText = "Ovoz Vizualizatsiyasini Yoqish";
                btnIcon.className = "fa-solid fa-microphone";
            }
        }

        // Main Animation Loop
        let frameCount = 0;
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            // FPS Calculation
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fpsCount').innerText = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }

            // Smooth camera movement towards mouse
            targetX += (mouseX - targetX) * 0.03;
            targetY += (-mouseY - targetY) * 0.03;

            particleSystem.rotation.y += 0.002;
            particleSystem.rotation.x += 0.001;

            camera.position.x = targetX * 0.8;
            camera.position.y = targetY * 0.8;
            camera.lookAt(scene.position);

            // Audio reaction logic
            if (isAudioActive && analyser) {
                analyser.getByteFrequencyData(dataArray);
                let avg = 0;
                for (let i = 0; i < dataArray.length; i++) avg += dataArray[i];
                avg = avg / dataArray.length;

                const scale = 1 + (avg / 100);
                particleSystem.scale.set(scale, scale, scale);
            }

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
