<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldCall — Taqdimot</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>body{margin:0;background:#050816;color:#fff;font-family:Inter,system-ui,Arial;min-height:100vh}header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff18}.logo{font-size:22px;font-weight:900}.status{color:#7df5bd;font-size:13px}.wrap{width:min(1150px,94%);margin:35px auto}.lobby{max-width:560px;margin:70px auto;background:#111a2dcc;border:1px solid #2b3858;border-radius:25px;padding:40px;text-align:center;box-shadow:0 25px 90px #0008}.icon{font-size:55px}.lobby h1{font-size:36px;margin:10px 0}.lobby p{color:#9eabc5;line-height:1.6}.input{width:100%;padding:15px;border-radius:13px;border:1px solid #33415f;background:#090f20;color:#fff;font-size:16px;box-sizing:border-box}.btn{margin-top:14px;width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(135deg,#7267ff,#1fb8d6);color:#fff;font-weight:800;font-size:16px;cursor:pointer}.call.hidden,.lobby.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.copy{background:#1a2741;color:#fff;border:1px solid #34415f;padding:10px 14px;border-radius:11px;cursor:pointer}.videos{display:grid;grid-template-columns:2fr 1fr;gap:14px}.card{height:64vh;min-height:350px;background:#02040a;border:1px solid #293651;border-radius:20px;overflow:hidden;position:relative}.card video{width:100%;height:100%;object-fit:cover}.local video{transform:scaleX(-1)}.label{position:absolute;left:12px;bottom:12px;background:#0009;padding:8px 10px;border-radius:9px;font-size:12px}.wait{position:absolute;inset:0;display:grid;place-items:center;color:#9eabc5;background:#050811aa}.controls{display:flex;justify-content:center;gap:10px;margin:15px 0}.control{padding:12px 18px;border-radius:13px;border:1px solid #33415f;background:#141e34;color:#fff;cursor:pointer}.danger{background:#6d2939}.small{font-size:11px;color:#aab5cd;display:block;margin-top:4px}@media(max-width:750px){.videos{grid-template-columns:1fr}.local{position:absolute;width:145px;height:190px;right:25px;top:105px;z-index:4;min-height:0}.card{height:63vh}.local video{height:190px}.lobby{margin:45px auto;padding:28px 20px}.lobby h1{font-size:29px}.top{gap:10px}.controls{flex-wrap:wrap}}</style></head><body><header><div class="logo">◉ WorldCall</div><div id="status" class="status">● Tayyor</div></header><main class="wrap"><section id="lobby" class="lobby"><div class="icon">🎥</div><h1>Ikki kishi. Bir qo‘ng‘iroq.</h1><p>Taqdimot saytidan chiqmasdan, ikki qurilmani bir xona orqali ulang.</p><input id="room" class="input" placeholder="Xona nomi: javlon-123"><button id="join" class="btn">Video qo‘ng‘iroqqa kirish →</button></section><section id="call" class="call hidden"><div class="top"><div><b id="roomName"></b><div id="connection" style="color:#9eabc5;font-size:12px">Ikkinchi odam kutilmoqda…</div></div><button id="copy" class="copy">🔗 Linkni nusxalash</button></div><div class="videos"><div class="card"><video id="remote" autoplay playsinline></video><div class="label">👤 Suhbatdosh</div><div id="wait" class="wait">Ikkinchi odam kutilmoqda…</div></div><div class="card local"><video id="local" autoplay muted playsinline></video><div class="label">Siz</div></div></div><div class="controls"><button id="mic" class="control">🎙️<span class="small">Mikrofon</span></button><button id="cam" class="control">📷<span class="small">Kamera</span></button><button id="screen" class="control">🖥️<span class="small">Ekran</span></button><button id="leave" class="control danger">☎<span class="small">Tugatish</span></button></div></section></main><script>const socket=io();let room='',stream=null,pc=null,initiator=false;const cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]};const $=id=>document.getElementById(id);function status(t){$('status').textContent='● '+t}function peer(){pc=new RTCPeerConnection(cfg);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{$('remote').srcObject=e.streams[0];$('wait').classList.add('hidden')};pc.onicecandidate=e=>e.candidate&&socket.emit('signal',{room,data:{type:'candidate',candidate:e.candidate}});pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){status('Ulangan');$('connection').textContent='● Ulangan';$('connection').style.color='#7df5bd'}}}async function offer(){const o=await pc.createOffer();await pc.setLocalDescription(o);socket.emit('signal',{room,data:{type:'offer',sdp:pc.localDescription}})}$('join').onclick=async()=>{room=$('room').value.trim();if(!room)return;$('join').disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=stream;$('lobby').classList.add('hidden');$('call').classList.remove('hidden');$('roomName').textContent='ROOM: '+room;status('Xonaga ulanmoqda…');socket.emit('join-room',room);history.replaceState({},'', '?room='+encodeURIComponent(room))}catch(e){alert('Kamera/mikrofonga ruxsat berilmadi.');$('join').disabled=false}};socket.on('joined',x=>{initiator=x.initiator;peer();if(initiator)status('Xona yaratildi')});socket.on('peer-joined',()=>initiator&&offer());socket.on('signal',async d=>{if(!pc)peer();if(d.type==='offer'){await pc.setRemoteDescription(d.sdp);const a=await pc.createAnswer();await pc.setLocalDescription(a);socket.emit('signal',{room,data:{type:'answer',sdp:pc.localDescription}})}else if(d.type==='answer'){await pc.setRemoteDescription(d.sdp)}else if(d.type==='candidate'){await pc.addIceCandidate(d.candidate)}});socket.on('room-full',()=>{alert('Bu xona band. Boshqa xona tanlang.');location.href='video.html'});socket.on('peer-left',()=>{$('wait').textContent='Suhbatdosh chiqib ketdi…';$('wait').classList.remove('hidden');$('connection').textContent='Suhbatdosh yo‘q';status('Kutish rejimi');pc?.close();pc=null});$('mic').onclick=()=>stream?.getAudioTracks().forEach(t=>t.enabled=!t.enabled);$('cam').onclick=()=>stream?.getVideoTracks().forEach(t=>t.enabled=!t.enabled);$('screen').onclick=async()=>{if(!pc)return;try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});const sender=pc.getSenders().find(x=>x.track?.kind==='video');await sender?.replaceTrack(s.getVideoTracks()[0]);s.getVideoTracks()[0].onended=()=>sender?.replaceTrack(stream.getVideoTracks()[0])}catch(e){}};$('copy').onclick=async()=>{await navigator.clipboard.writeText(location.href);$('copy').textContent='✓ Nusxalandi';setTimeout(()=>$('copy').textContent='🔗 Linkni nusxalash',1500)};$('leave').onclick=()=>{socket.emit('leave-room');stream?.getTracks().forEach(t=>t.stop());pc?.close();location.href='video.html'};const q=new URLSearchParams(location.search).get('room');if(q)$('room').value=q</script></body></html>
